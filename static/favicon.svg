<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
	<style>
		:root {
			--stop-1: #6366f1;
			--stop-2: #4338ca;
			--fg: #ffffff;
		}
		@media (prefers-color-scheme: light) {
			:root {
				--stop-1: #4f46e5;
				--stop-2: #3730a3;
				--fg: #ffffff;
			}
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--stop-1: #818cf8;
				--stop-2: #4f46e5;
				--fg: #ffffff;
			}
		}
		.bg-rect {
			fill: url(#brand-grad);
		}
		.brand-text {
			fill: var(--fg);
		}
	</style>
	<defs>
		<linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="var(--stop-1, #6366f1)" />
			<stop offset="100%" stop-color="var(--stop-2, #4338ca)" />
		</linearGradient>
	</defs>
	<rect class="bg-rect" width="460" height="460" x="26" y="26" rx="104" />
	<text
		class="brand-text"
		x="256"
		y="336"
		font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
		font-size="240"
		font-weight="900"
		letter-spacing="-8"
		text-anchor="middle"
	>26</text>
</svg>