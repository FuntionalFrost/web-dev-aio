<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#4f46e5" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
		<meta property="og:locale" content="en_US" />
		%sveltekit.head%
		<script>
			(function () {
				try {
					const saved = localStorage.getItem('theme');
					const prefDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					const theme = saved || (prefDark ? 'dark' : 'light');
					document.documentElement.dataset.theme = theme;
					document.documentElement.style.colorScheme = theme;
				} catch (_) {
					document.documentElement.dataset.theme = 'dark';
					document.documentElement.style.colorScheme = 'dark';
				}
			})();
		</script>
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-white text-slate-900 transition-colors duration-150 dark:bg-slate-950 dark:text-slate-100"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
